<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学習記録</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="summary-grid" aria-label="学習時間概要">
      <div class="summary-item">
        <span>直近30日</span>
        <strong id="last30Total">—</strong>
      </div>
      <div class="summary-item">
        <span>過去30日の1日平均</span>
        <strong id="last30Average">—</strong>
      </div>
      <div class="summary-item">
        <span>今週</span>
        <strong id="thisWeekTotal">—</strong>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>週間学習時間</h2>
        <div class="week-nav">
          <button id="prevWeek" type="button" aria-label="前の週を見る">‹</button>
          <span id="weekLabel">—</span>
          <button id="nextWeek" type="button" aria-label="次の週を見る">›</button>
        </div>
      </div>

      <div id="weekGrid" class="week-grid" aria-live="polite"></div>
    </section>
  </main>

  <!--
    ================================
    毎日の更新はここだけ
    ================================

    例：8時間10分なら、そのまま "8:10" と書くだけ

    { date: "2026-08-27", time: "8:10" },

    同じ日付を2回書かないでください。
  -->
  <script>
    const STUDY_DATA = [
      { date: "2026-08-17", time: "7:40" },
      { date: "2026-08-18", time: "8:20" },
      { date: "2026-08-19", time: "6:50" },
      { date: "2026-08-20", time: "9:10" },
      { date: "2026-08-21", time: "8:00" },
      { date: "2026-08-22", time: "5:30" },
      { date: "2026-08-23", time: "4:50" },
      { date: "2026-08-24", time: "6:50" },
      { date: "2026-08-25", time: "9:00" },
      { date: "2026-08-26", time: "7:20" },
      { date: "2026-08-27", time: "8:10" }
    ];
  </script>
  <script src="script.js"></script>
</body>
</html>
